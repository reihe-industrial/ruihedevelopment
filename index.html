<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>土地開發紀錄系統 示範</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#15251F; --ink-2:#4A5B54; --line:#D5DDD8;
  --brand:#1F5C46; --on-brand:#FFFFFF; --map-bg:#E3EAE5; --road:#F4F7F5; --parcel-stroke:#FFFFFF;
  --danger:#B3362A; --focus:#1F5C46; --block-line:#1F5C46;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1814; --surface:#16231E; --surface-2:#1C2B25; --ink:#E6EEE9; --ink-2:#A8B8B0; --line:#2B3C35;
    --brand:#4FB58C; --on-brand:#0E1814; --map-bg:#111E19; --road:#192923; --parcel-stroke:#16231E;
    --danger:#F08A7C; --focus:#4FB58C; --block-line:#4FB58C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1814; --surface:#16231E; --surface-2:#1C2B25; --ink:#E6EEE9; --ink-2:#A8B8B0; --line:#2B3C35;
  --brand:#4FB58C; --on-brand:#0E1814; --map-bg:#111E19; --road:#192923; --parcel-stroke:#16231E;
  --danger:#F08A7C; --focus:#4FB58C; --block-line:#4FB58C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:15px;line-height:1.55}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand strong{display:block;font-size:16px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:wrap}
.tabs a{padding:8px 14px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.tabs a:hover{background:var(--surface-2)}
.tabs a[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 10px;font-size:13px}
select,input[type=text],input[type=search],input[type=date],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%}
.tools select{width:auto}
main{flex:1;min-height:0}
.view{display:none;height:100%}
.view.on{display:block;overflow:auto}
#view-map.on{display:grid;grid-template-columns:292px minmax(0,1fr) 380px;overflow:hidden}
.side,.detail{overflow:auto;background:var(--surface);padding:16px;min-height:0}
.side{border-right:1px solid var(--line)}
.detail{border-left:1px solid var(--line)}
.mapwrap{position:relative;background:var(--map-bg);min-width:0;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.p{stroke:var(--parcel-stroke);stroke-width:1.5;cursor:pointer;transition:opacity .15s;vector-effect:non-scaling-stroke}
.p:hover{stroke:var(--ink);stroke-width:2.5}
.lbl{pointer-events:none;font-weight:700;text-anchor:middle;font-family:'Noto Sans TC',sans-serif}
.zoom{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px;line-height:1}
.maplegend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;max-width:calc(100% - 24px)}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maphint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.dot{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 8px;font-size:13px;background:var(--surface);white-space:nowrap}
.pill .dot{border-radius:50%;width:10px;height:10px}
h2{font-size:17px;margin:0 0 4px;line-height:1.3}
h3{font-size:14px;margin:18px 0 8px;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.role-note{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.metric .k{font-size:12px;color:var(--ink-2)}
.metric .v{font-size:20px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0 8px}
.barlist{display:grid;gap:3px;font-size:13px}
.barlist div{display:flex;align-items:center;gap:8px}
.barlist .n{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px 2px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.field{margin-top:12px}
.field>label,.lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.thr{display:flex;align-items:center;gap:10px}
.thr input{flex:1}
.empty{padding:28px 8px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.d-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:14px}
dt{color:var(--ink-2)}
dd{margin:0;text-align:right}
.over{color:var(--danger);font-weight:500}
.ocard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2)}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:4px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--dotc,var(--line))}
.tl li::after{content:"";position:absolute;left:8px;top:19px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl .t{font-weight:500}
.page{padding:20px;max-width:1180px;margin:0 auto}
.page h1{font-size:20px;margin:0 0 4px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--ink-2);background:var(--surface-2);font-size:13px}
tr:last-child td{border-bottom:0}
.bar-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.bar-tools input,.bar-tools select{width:auto;min-width:180px}
.group{margin-top:22px}
.group h2{display:flex;align-items:center;gap:8px}
.count{font-size:13px;font-weight:400;color:var(--ink-2)}
.frow{display:grid;grid-template-columns:100px minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.frow .who{font-weight:700}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(8,18,14,.55)}
.dlg{padding:18px 20px;max-height:90vh;overflow:auto}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:50}
.toast.on{opacity:1}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:13px;margin:0 6px 6px 0}
.chipbtn:hover{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .k{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.lvbar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--line);margin:6px 0 0}
.hb{display:grid;grid-template-columns:230px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.hb .tr{height:14px;background:var(--line);border-radius:6px;overflow:hidden}
.hb .tr div{height:100%}
.hb .n{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.expcard{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.expcard:last-child{border-bottom:0}
.expcard b{display:block}
.dropzone{border:1.5px dashed var(--line);border-radius:12px;padding:14px;background:var(--surface-2);margin-top:10px}
.ok{color:var(--brand);font-weight:500}
.bad{color:var(--danger);font-weight:500}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-2);margin-top:10px}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pcard.cur{border:2px solid var(--brand);padding:15px}
.pcard h2{font-size:17px;margin:0}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pstats .k{font-size:12px;color:var(--ink-2)}
.pstats .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.imstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.panel+.panel{margin-top:14px}
.panel h2 .no{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:13px;margin-right:8px}
.wrapcell{white-space:normal;min-width:240px}
.osec{border-top:1px solid var(--line);padding:6px 0}
.osec summary{cursor:pointer;font-size:14px;color:var(--ink)}
.calwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calh{background:var(--surface-2);padding:6px;text-align:center;font-size:13px;color:var(--ink-2)}
.cell{background:var(--surface);min-height:92px;padding:4px;text-align:left;border:0;cursor:pointer;font-size:12px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2);opacity:.6}
.cell.sel{outline:2px solid var(--brand);outline-offset:-2px}
.cell .dn{font-size:12px;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cell.today .dn{background:var(--brand);color:var(--on-brand);font-weight:700}
.cev{border-left:3px solid var(--brand);padding:0 4px;background:var(--surface-2);border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cev.done{text-decoration:line-through;opacity:.55}
.cev.fu{border-left-style:dashed;background:transparent}
@media (max-width:1180px){.calwrap{grid-template-columns:minmax(0,1fr)}}
.chip.tog[aria-pressed="false"]{text-decoration:none;opacity:.6;border-style:dashed}
.chip.tog[aria-pressed="true"]{border-color:var(--brand);font-weight:500}
.vhint{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.vgroup{margin-top:14px}
.vgroup summary{cursor:pointer;font-size:14px;color:var(--brand);font-weight:500}
.panel .tablewrap{margin-top:8px}
.spicker summary{cursor:pointer;font-size:14px}
.spbox{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);min-width:240px}
.spbox input[type=search]{margin-bottom:6px}
.splist{max-height:200px;overflow:auto;display:grid;gap:2px}
.sprow{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.sprow:hover{background:var(--surface-2)}
@media (max-width:1180px){
  #view-map.on{display:block;overflow:auto}
  .mapwrap{height:62vh;min-height:380px}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .detail{border-left:0;border-top:1px solid var(--line)}
  .frow{grid-template-columns:70px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.p,.toast{transition:none}}
</style>
<link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="images/icon.png" alt="瑞禾開發" width="36" height="36" style="width:36px;height:36px;flex:none">
      <div><strong>土地開發紀錄系統</strong><small id="whoami">請先登入</small></div>
    </div>
    <nav class="tabs" aria-label="主要功能">
      <a href="#projects" data-v="projects">專案總覽</a>
      <a href="#visits" data-v="visits">案件拜訪總覽</a>
      <a href="#tasks" data-v="tasks">行事曆與待辦</a>
      <a href="#stats" data-v="stats">統計</a>
      <a href="#admin" data-v="admin" id="tab-admin">後台</a>
    </nav>
    <div class="tools" style="display:none">
      <label>目前專案(演示用)
        <select id="proj" aria-label="切換專案"></select>
      </label>
      <label>目前角色(演示用)
        <select id="role">
          <option value="admin">管理者</option>
          <option value="lead">專案負責人</option>
          <option value="staff">承辦人員(承辦人甲)</option>
        </select>
      </label>
      <button class="btn" id="reset" type="button">重設示範資料</button>
    </div>
    <div class="tools"><span id="who2" class="small"></span><button class="btn" id="logout" type="button">登出</button></div>
  </header>
  <main>
    <section id="view-projects" class="view"><div class="page" id="projects-page"></div></section>
    <section id="view-import" class="view"><div class="page" id="import-page"></div></section>
    <section id="view-map" class="view" aria-label="地圖">
      <aside class="side" id="side"></aside>
      <div class="mapwrap">
        <svg id="map" viewBox="0 0 1000 660" role="group" aria-label="地籍圖示意,點選地號查看詳情"></svg>
        <div class="zoom">
          <button class="btn" id="zin" type="button" aria-label="放大">+</button>
          <button class="btn" id="zout" type="button" aria-label="縮小">−</button>
          <button class="btn" id="zfit" type="button" aria-label="回到全區">⌂</button>
        </div>
        <div class="maplegend" id="maplegend"></div>
        <div class="maphint">滾輪縮放,拖曳移動</div>
      </div>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </section>
    <section id="view-visits" class="view"><div class="page" id="visits-page"></div></section>
    <section id="view-deeds" class="view"><div class="page" id="deeds-page"></div></section>
    <section id="view-tasks" class="view"><div class="page" id="tasks-page"></div></section>
    <section id="view-reports" class="view"><div class="page" id="reports-page"></div></section>
    <section id="view-stats" class="view"><div class="page" id="stats-page"></div></section>
    <section id="view-data" class="view"><div class="page" id="data-page"></div></section>
    <section id="view-admin" class="view"><div class="page" id="admin-page"></div></section>
  </main>
</div>

<dialog id="dlg-int" aria-labelledby="int-title">
  <form class="dlg" id="int-form">
    <div class="dlg-h"><h2 id="int-title">新增訪談</h2><button class="btn small" type="button" data-close>關閉</button></div>
    <p class="muted small" id="int-sub" style="margin:0 0 6px"></p>
    <div class="field"><label for="f-owner">地主</label><select id="f-owner" name="owner"></select></div>
    <div class="row2">
      <div class="field"><label for="f-date">訪談日期</label><input type="date" id="f-date" name="date" required></div>
      <div class="field"><label for="f-method">方式</label><select id="f-method" name="method"><option>拜訪</option><option>電話</option><option>LINE</option></select></div>
    </div>
    <div class="field"><label for="f-sum">內容摘要</label><textarea id="f-sum" name="summary" rows="3" required placeholder="例:願意了解方案,關切價格與稅負"></textarea></div>
    <div class="field"><span class="lab">地主關切(可複選)</span><div class="chips" id="f-tags"></div></div>
    <div class="row2">
      <div class="field"><label for="f-level">訪談後意願</label><select id="f-level" name="level"></select></div>
      <div class="field"><label for="f-next">下次跟進日</label><input type="date" id="f-next" name="next"></div>
    </div>
    <div class="actions"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">儲存訪談</button></div>
  </form>
</dialog>
<dialog id="dlg-owner" aria-label="地主詳情"><div class="dlg" id="owner-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="login" style="display:none"><div class="lcard">
  <div style="background:#fff;border-radius:10px;padding:10px;margin:0 0 16px;text-align:center"><img src="images/logo-full.jpg" alt="瑞禾開發 建築・地產整合團隊" style="max-width:100%;height:auto;display:block;margin:0 auto"></div>
  <h1>土地開發紀錄系統</h1>
  <p class="small muted" style="margin:0 0 14px">請用公司登記的信箱登入。系統會寄 6 位數驗證碼給您。</p>

    for(var k=0;k<steps.length;k++){
      var f=f0*steps[k],w=len*f*0.62,h=f*1.05,bx=e.p.cx-w/2,by=e.p.cy-h/2,hit=false;
      for(var i=0;i<placed.length;i++){var r=placed[i];if(bx<r[2]&&bx+w>r[0]&&by<r[3]&&by+h>r[1]){hit=true;break}}
      if(!hit){chosen=steps[k];box=[bx,by,bx+w,by+h];break}
    }
    var f1=f0*chosen;
    if(!box)box=[e.p.cx-len*f1*0.31,e.p.cy-f1/2,e.p.cx+len*f1*0.31,e.p.cy+f1/2];
    placed.push(box);
    e.l1.setAttribute('font-size',Math.round(f1*100)/100);
    e.l1.setAttribute('y',e.p.cy);e.l1.setAttribute('dominant-baseline','central');e.l1.setAttribute('display','');
    var second=f1*sc>=12;
    e.l2.setAttribute('font-size',Math.round(f1*80)/100);
    e.l2.setAttribute('y',e.p.cy+f1*1.05);e.l2.setAttribute('dominant-baseline','central');
    e.l2.setAttribute('display',second?'':'none');
  });
}

function clampVB(){
  vb.x=clamp(vb.x,-vb.w*.4,1000-vb.w*.6);
  vb.y=clamp(vb.y,-vb.h*.4,660-vb.h*.6);
}
function svgPt(cx,cy){
  var svg=$('#map'),pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;
  var m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:vb.x+vb.w/2,y:vb.y+vb.h/2};
}
function zoomAt(f,x,y){
  var nw=clamp(vb.w*f,(PRJ[S.proj]&&PRJ[S.proj].geo)?35:230,1000),r=nw/vb.w;
  vb.x=x-(x-vb.x)*r;vb.y=y-(y-vb.y)*r;vb.w=nw;vb.h=vb.h*r;
  clampVB();applyVB();
}
function fitAll(){vb={x:0,y:0,w:1000,h:660};applyVB()}
function focusParcel(p){
  var svg=$('#map'),ar=svg.clientHeight/Math.max(1,svg.clientWidth);
  var w=420,h=Math.max(w*ar,10);
  vb={x:p.cx-w/2,y:p.cy-h/2,w:w,h:h};

var drag=null,moved=false;
function initMapEvents(){
  var svg=$('#map');
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    var pt=svgPt(e.clientX,e.clientY);
    zoomAt(e.deltaY<0?.85:1/.85,pt.x,pt.y);
  },{passive:false});
  svg.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=false;
  });
  window.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>5){moved=true;svg.classList.add('drag')}
    if(moved){
      var m=svg.getScreenCTM(),s=m?m.a:1;
      vb.x=drag.vx-dx/s;vb.y=drag.vy-dy/s;clampVB();applyVB();
    }
  });
  window.addEventListener('pointerup',function(){drag=null;svg.classList.remove('drag');setTimeout(function(){moved=false},0)});
  svg.addEventListener('click',function(e){
    if(moved)return;
    var t=e.target.closest?e.target.closest('polygon.p'):null;
    if(t)selectParcel(+t.getAttribute('data-id'),false);
  });
  svg.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('p')){
      e.preventDefault();selectParcel(+e.target.getAttribute('data-id'),false);
    }
  });
  $('#zin').onclick=function(){zoomAt(.75,vb.x+vb.w/2,vb.y+vb.h/2)};
  $('#zout').onclick=function(){zoomAt(1/.75,vb.x+vb.w/2,vb.y+vb.h/2)};
  $('#zfit').onclick=fitAll;
}

function deleteStaff(id){
  var sel=$('#staff-del-to'),to=sel?sel.value:'',st=staffStats(id),sole=soleProjects(id),need=st.owners>0||st.subs>0||sole.length>0;
  if(id===ME){toast('承辦人甲是演示用的登入身分,不能刪除。');return}
  if(need&&!to){toast('請先選擇要改派給哪一位。');return}
  DB.projects.forEach(function(pr){
    var had=pr.staff.indexOf(id)>=0,moved=false;
    projOwners(pr.id).forEach(function(o){o.asg2=o.asg2||{};if(asgOf(o,pr.id)===id){o.asg[pr.id]=to;if(o.asg2[pr.id]===to)o.asg2[pr.id]='';moved=true}else if(asg2Of(o,pr.id)===id){o.asg2[pr.id]=(asgOf(o,pr.id)===to)?'':to;moved=true}});

    pr.staff=pr.staff.filter(function(x){return x!==id});

  indexDB();renderAll();
  toast('已刪除承辦人'+id+'。'+(st.owners+st.subs?(st.owners+st.subs)+' 位地主已改派給承辦人'+to+'。':''));
}

function stageIdx(x){return STAGES.indexOf(x)}
function dealOf(o,pid){pid=pid||S.proj;var k=pid+'|'+o.id;if(!DB.deals[k])DB.deals[k]={ask:0,offer:0,stage:'未開始',stageLog:[],note:''};return DB.deals[k]}

function ownerAreaIn(o,pid){var a=0;ownerParcels(o,pid).forEach(function(x){a+=x.p.area*x.po.frac});return a}
function agrees(o,pid){return oState(o,pid).lv==='A'||stageIdx(dealOf(o,pid).stage)>=2}
function agreeOf(p){
  var heads=p.owners.length,agree=0,share=0,ashare=0;
  p.owners.forEach(function(po){var o=OWN[po.owner];share+=po.frac;if(agrees(o,p.proj)){agree++;ashare+=po.frac}});
  return {heads:heads,agree:agree,share:share,ashare:ashare,hp:heads?agree/heads:0,sp:share?ashare/share:0};
}
function agreeOk(p){var r=agreeOf(p),rule=PRJ[p.proj].rule||{headPct:50,sharePct:50};return r.hp*100>rule.headPct&&r.sp*100>rule.sharePct}

function landTax(p){
  if(!p.value||!p.prevValue)return null;
  var idx=p.idx||1,now=p.value*p.area,prev=p.prevValue*idx*p.area,gain=now-prev;
  if(gain<=0)return {now:now,prev:prev,gain:gain,tax:0,ratio:0};
  var r=gain/prev,tax=r<1?gain*0.2:r<2?gain*0.3-prev*0.1:gain*0.4-prev*0.3;
  return {now:now,prev:prev,gain:gain,tax:tax,ratio:r};
}

var RP={period:'week',proj:'all'};

function periodRange(k){
  var t=new Date(TODAY),dow=(t.getDay()+6)%7,s,e;
  if(k==='week'){s=addDays(-dow);e=addDays(6-dow)}
  else if(k==='lastweek'){s=addDays(-dow-7);e=addDays(-dow-1)}
  else if(k==='month'){s=new Date(t.getFullYear(),t.getMonth(),1);e=new Date(t.getFullYear(),t.getMonth()+1,0)}
  else{s=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0)}
  return {s:s,e:e};
}
function levelAtDate(o,pid,d){
  var best=null;
  DB.interviews.forEach(function(iv){if(iv.proj===pid&&iv.owner===o.id&&iv.date<=d&&(!best||iv.date>best.date||(iv.date.getTime()===best.date.getTime()&&iv.id>best.id)))best=iv});
  return best?best.level:'N';
}

  var sIso=iso(r.s),eIso=iso(r.e),before=new Date(r.s);before.setDate(before.getDate()-1);
  var R={r:r,iv:0,newC:0,up:[],down:[],over:0,moves:[],signedPg:0,donePg:0,by:{},tasksDone:0};
  function row(x){return R.by[x]=R.by[x]||{iv:0,newC:0,up:0,over:0,moves:0,tk:0}}
  vis.forEach(function(pr){
    projOwners(pr.id).forEach(function(o){
      var asg=asgOf(o,pr.id),st=oState(o,pr.id),ivs=DB.interviews.filter(function(i){return i.proj===pr.id&&i.owner===o.id&&i.date>=r.s&&i.date<=r.e});
      var a=row(asg);R.iv+=ivs.length;a.iv+=ivs.length;
      var l0=levelAtDate(o,pr.id,before),l1=levelAtDate(o,pr.id,r.e);
      if(l0==='N'&&ivs.length){R.newC++;a.newC++}
      else if(l0!=='N'){
        if(LV[l1].rank>LV[l0].rank){R.up.push({o:o,pr:pr,from:l0,to:l1});a.up++}
        else if(LV[l1].rank<LV[l0].rank)R.down.push({o:o,pr:pr,from:l0,to:l1});
      }
      if(st.next&&diffDays(st.next)<0){R.over++;a.over++}
      var d=DB.deals[pr.id+'|'+o.id];
      if(d)d.stageLog.forEach(function(x){
        if(x.date>=sIso&&x.date<=eIso){
          R.moves.push({o:o,pr:pr,stage:x.stage,date:x.date});a.moves++;
          var pg=ownerAreaIn(o,pr.id)*0.3025;

  });
  return R;
}

var dl=null,dlState='pending',IMP=null,impMsg='';
function csvCell(v){
  if(v===null||v===undefined)v='';
  v=String(v);
  if(/^[=+\-@\t\r]/.test(v)&&!/^-?\d+(\.\d+)?$/.test(v))v="'"+v;
  return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function toCSV(rows){return '\uFEFF'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}
function parseCSV(text,delim){
  delim=delim||',';
  text=text.replace(/^\uFEFF/,'');
  var rows=[],row=[],cur='',q=false,i,c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===delim){row.push(cur);cur=''}
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(cur);cur='';
        if(row.length>1||row[0]!=='')rows.push(row);
        row=[];
      }else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);if(row.length>1||row[0]!=='')rows.push(row)}
  return rows;
}

function computeStats(){

  res.types={};

function colIndex(head,names){for(var i=0;i<head.length;i++){if(names.indexOf(String(head[i]).trim())>=0)return i}return -1}
function parseDateLoose(v){
  v=String(v||'').trim();if(!v)return null;
  var m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/),d;
  if(m){d=new Date(+m[1],+m[2]-1,+m[3]);return d.getMonth()===+m[2]-1?d:null}
  m=v.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if(m){d=new Date(TODAY.getFullYear(),+m[1]-1,+m[2]);return d.getMonth()===+m[1]-1?d:null}
  return null;
}
function parseLevel(v){

function weeklySVG(w){

/* ---------- mapkit: vector map extraction (works in node and browser) ---------- */
function mkHex(r,g,b){function h(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16)}return '#'+h(r)+h(g)+h(b)}
function mkMul(a,b){return [a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]]}
function mkColor(args){
  if(typeof args[0]==='string'&&args[0].charAt(0)==='#')return args[0].toLowerCase();
  var r=args[0],g=args[1],b=args[2];
  if(r<=1&&g<=1&&b<=1&&(r%1!==0||g%1!==0||b%1!==0))return mkHex(r*255,g*255,b*255);
  return mkHex(r,g,b);
}
function mkBez(p0,c1,c2,p3,n){var out=[];for(var i=1;i<=n;i++){var t=i/n,u=1-t;out.push([u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p3[1]])}return out}
/* page: pdf.js page; OPS: pdfjsLib.OPS. Returns {w,h,items:[{kind:'stroke'|'fill',color,width,rings:[{pts:[[x,y]..],closed}]}],texts:[{s,x,y,w,h}]} with y pointing DOWN */
async function mkExtract(page,OPS){
  var vp=page.getViewport({scale:1}),W=vp.width,H=vp.height;
  var ol=await page.getOperatorList(),fn=ol.fnArray,ar=ol.argsArray;
  var ctm=[1,0,0,1,0,0],stack=[],sc='#000000',fc='#000000',lw=1,items=[],cur=[],ring=null,pos=[0,0];
  function P(x,y){var X=ctm[0]*x+ctm[2]*y+ctm[4],Y=ctm[1]*x+ctm[3]*y+ctm[5];return [X,H-Y]}
  function startRing(){ring={pts:[],closed:false};cur.push(ring)}
  function emit(kind){
    if(!cur.length)return;
    var rings=cur.filter(function(r){return r.pts.length>=2});
    if(rings.length)items.push({kind:kind,color:kind==='fill'?fc:sc,width:lw*Math.sqrt(Math.abs(ctm[0]*ctm[3]-ctm[1]*ctm[2])),rings:rings});
    cur=[];ring=null;
  }
  for(var i=0;i<fn.length;i++){
    var op=fn[i],a=ar[i];
    if(op===OPS.save)stack.push([ctm.slice(),sc,fc,lw]);
    else if(op===OPS.restore){var s=stack.pop();if(s){ctm=s[0];sc=s[1];fc=s[2];lw=s[3]}}
    else if(op===OPS.transform)ctm=mkMul(ctm,a);
    else if(op===OPS.setStrokeRGBColor)sc=mkColor(a);
    else if(op===OPS.setFillRGBColor)fc=mkColor(a);
    else if(op===OPS.setLineWidth)lw=a[0];
    else if(op===OPS.constructPath){
      var ops=a[0],co=a[1],ci=0;
      for(var k=0;k<ops.length;k++){
        var o=ops[k];
        if(o===OPS.moveTo){startRing();pos=[co[ci],co[ci+1]];ci+=2;ring.pts.push(P(pos[0],pos[1]))}
        else if(o===OPS.lineTo){if(!ring)startRing();pos=[co[ci],co[ci+1]];ci+=2;ring.pts.push(P(pos[0],pos[1]))}
        else if(o===OPS.curveTo){if(!ring)startRing();var c1=[co[ci],co[ci+1]],c2=[co[ci+2],co[ci+3]],p3=[co[ci+4],co[ci+5]];ci+=6;mkBez(pos,c1,c2,p3,6).forEach(function(q){ring.pts.push(P(q[0],q[1]))});pos=p3}
        else if(o===OPS.curveTo2){var c2b=[co[ci],co[ci+1]],p3b=[co[ci+2],co[ci+3]];ci+=4;mkBez(pos,pos,c2b,p3b,6).forEach(function(q){ring.pts.push(P(q[0],q[1]))});pos=p3b}
        else if(o===OPS.curveTo3){var c1c=[co[ci],co[ci+1]],p3c=[co[ci+2],co[ci+3]];ci+=4;mkBez(pos,c1c,p3c,p3c,6).forEach(function(q){ring.pts.push(P(q[0],q[1]))});pos=p3c}
        else if(o===OPS.closePath){if(ring)ring.closed=true}
        else if(o===OPS.rectangle){startRing();var x=co[ci],y=co[ci+1],w=co[ci+2],h=co[ci+3];ci+=4;ring.pts.push(P(x,y),P(x+w,y),P(x+w,y+h),P(x,y+h),P(x,y));ring.closed=true}
      }
    }
    else if(op===OPS.stroke||op===OPS.closeStroke)emit('stroke');
    else if(op===OPS.fill||op===OPS.eoFill)emit('fill');
    else if(op===OPS.fillStroke||op===OPS.eoFillStroke||op===OPS.closeFillStroke||op===OPS.closeEOFillStroke){var save=cur.map(function(r){return {pts:r.pts.slice(),closed:r.closed}});emit('fill');cur=save;emit('stroke')}
    else if(op===OPS.endPath){cur=[];ring=null}
  }
  var tc=await page.getTextContent(),texts=[];

  sel.forEach(function(p){var b=mkBBox(p.pts);x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])});
  var zx0=x0,zy0=y0,zx1=x1,zy1=y1;
  (a.zoneItems||[]).forEach(function(z){z.rings.forEach(function(r){r.forEach(function(p){zx0=Math.min(zx0,p[0]);zy0=Math.min(zy0,p[1]);zx1=Math.max(zx1,p[0]);zy1=Math.max(zy1,p[1])})})});
  // view bbox: parcels plus zones, but limit zone influence to 150 m margin
  var vx0=Math.max(zx0,x0-150),vy0=Math.max(zy0,y0-150),vx1=Math.min(zx1,x1+150),vy1=Math.min(zy1,y1+150);
  vx0=Math.min(vx0,x0);vy0=Math.min(vy0,y0);vx1=Math.max(vx1,x1);vy1=Math.max(vy1,y1);
  var sc=Math.min(920/(vx1-vx0),580/(vy1-vy0)),ox=40+(920-(vx1-vx0)*sc)/2,oy=40+(580-(vy1-vy0)*sc)/2;

  var parcels={};
  Object.keys(a.assign).forEach(function(no){
    var p=cad[a.assign[no].poly],b=mkBBox(p.pts),mix={},cnt=0;
    var ya=Math.max(0,Math.floor((b[1]-vy0)/res)),yb=Math.min(RH-1,Math.ceil((b[3]-vy0)/res)),xa=Math.max(0,Math.floor((b[0]-vx0)/res)),xb=Math.min(RW-1,Math.ceil((b[2]-vx0)/res));
    for(var y=ya;y<=yb;y++)for(var x=xa;x<=xb;x++){
      var pt=[vx0+(x+0.5)*res,vy0+(y+0.5)*res];
      if(!mkInPoly(pt,p.pts))continue;cnt++;
      var v=R.d[y*RW+x];if(v)mix[zn[v-1]]=(mix[zn[v-1]]||0)+res*res;
    }
    Object.keys(mix).forEach(function(k){mix[k]=Math.round(mix[k]*10)/10});
    var c=mkCentroid(p.pts),cc=T(c),bw=(b[2]-b[0])*sc,bh=(b[3]-b[1])*sc;

  });
  // context polygons and labels
  var used={};Object.keys(a.assign).forEach(function(no){used[a.assign[no].poly]=1});
  var ctx=[],ctxlab=[],mx0=x0-60,my0=y0-60,mx1=x1+60,my1=y1+60;
  cad.forEach(function(p,i){
    if(used[i]||p.area>60000)return;var b=mkBBox(p.pts);if(b[2]<mx0||b[0]>mx1||b[3]<my0||b[1]>my1)return;
    var s=mkSimplify(p.pts,0.5);ctx.push(s.map(T));
    if(p.area>400&&a.texts){
      var lab=null;for(var k=0;k<a.texts.length;k++){var t=a.texts[k];if(/^\d+(-\d+)?$/.test(t.s)&&t.x>=b[0]&&t.x<=b[2]&&t.y>=b[1]&&t.y<=b[3]&&mkInPoly([t.x,t.y],p.pts)){lab=t.s;break}}
      if(lab){var c=T(mkCentroid(p.pts));ctxlab.push({t:lab,c:c,f:Math.round(Math.max(2.2,Math.min(9,Math.min((b[2]-b[0])*sc,(b[3]-b[1])*sc)*0.3))*10)/10})}
    }
  });
  var zones={};
  (a.zoneItems||[]).forEach(function(z){
    var ar=0;z.rings.forEach(function(r,i){ar+=(i===0?1:-1)*mkArea(r)});
    var b=mkBBox(z.rings[0]);if(b[2]<vx0||b[0]>vx1||b[3]<vy0||b[1]>vy1)return;
    if(ar<20)return;
    (zones[z.name]||(zones[z.name]=[])).push(z.rings.map(function(r){return mkSimplify(r,0.5).map(T)}));
  });
  return {parcels:parcels,ctx:ctx,ctxlab:ctxlab,zones:zones,dev:[],scale:Math.round(1/sc*10000)/10000};
}

var KNOWN_ZC={'#da9201':'產業專用區','#b85c00':'產業專用區','#7eff00':'綠地用地','#00ff00':'公園用地兼滯洪池使用','#ff7eff':'細部計畫道路用地','#ff00ff':'廣場用地兼供停車場使用'};
var GEOIM={cad:null,zon:null,as:null,reg:null,cp:null,groups:[],names:{},skip:{},busy:'',err:'',geo:null};
function geoReset(){GEOIM={cad:null,zon:null,as:null,reg:null,cp:null,groups:[],names:{},skip:{},busy:'',err:'',geo:null}}
function geoTick(){return new Promise(function(r){setTimeout(r,30)})}
async function geoExtract(file){
  var lib=await loadPdfJs(),buf=await fileToBuffer(file);
  var doc=await lib.getDocument({data:new Uint8Array(buf)}).promise,page=await doc.getPage(1);
  return mkExtract(page,lib.OPS);
}
function geoSegs(ex,filter){var segs=[];ex.items.forEach(function(it){if(it.kind!=='stroke'||!filter(it))return;it.rings.forEach(function(r){for(var i=0;i<r.pts.length-1;i++)segs.push([r.pts[i][0],r.pts[i][1],r.pts[i+1][0],r.pts[i+1][1]])})});return segs}
function geoRegList(){return ((IM.res&&IM.res.parcels)||[]).map(function(p){return {no:String(p.no),area:p.area||0}})}
function geoAssignNow(){
  if(!GEOIM.cad)return;
  var reg=geoRegList();
  if(!reg.length){GEOIM.as=null;return}
  GEOIM.as=mkAssign(GEOIM.cad.polys,GEOIM.cad.ex.texts,reg);
  var K=GEOIM.as.K;
  if(K){GEOIM.cp=GEOIM.cad.polys.map(function(p){return {pts:p.pts.map(function(q){return [q[0]*K,q[1]*K]}),area:p.area*K*K}})}
}
async function handleCadFile(file){
  GEOIM.busy='正在讀取地籍圖…';GEOIM.err='';renderGeoPanel();await geoTick();
  try{
    var ex=await geoExtract(file),cnt={};
    ex.items.forEach(function(it){if(it.kind!=='stroke'||it.width>=2)return;var n=0;it.rings.forEach(function(r){n+=r.pts.length-1});cnt[it.color]=(cnt[it.color]||0)+n});
    var col=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0];
    if(!col||cnt[col]<50)throw new Error('這份 PDF 裡找不到足夠的地籍線條,可能是掃描檔或圖片');
    var segs=geoSegs(ex,function(it){return it.color===col&&it.width<2});
    GEOIM.busy='正在切出每一塊地…';renderGeoPanel();await geoTick();
    var polys=mkPolygonize(segs,0.03).filter(function(p){return p.area>0.1&&p.area<60000});
    GEOIM.cad={name:file.name,ex:ex,segs:segs,polys:polys};GEOIM.reg=null;GEOIM.geo=null;
    geoAssignNow();GEOIM.busy='';
  }catch(e){GEOIM.busy='';GEOIM.err='讀取地籍圖失敗:'+(e&&e.message?e.message:e)}
  renderGeoPanel();
  if(GEOIM.cad&&GEOIM.zon&&GEOIM.as&&GEOIM.as.K)geoRegisterNow();
}
async function handleZonFile(file){
  GEOIM.busy='正在讀取細部計畫圖…';GEOIM.err='';renderGeoPanel();await geoTick();

    var ex=await geoExtract(file),cnt={};
    ex.items.forEach(function(it){if(it.kind!=='stroke'||it.color==='#000000')return;var n=0;it.rings.forEach(function(r){n+=r.pts.length-1});cnt[it.color]=(cnt[it.color]||0)+n});
    var lc=Object.keys(cnt).filter(function(k){return cnt[k]>500});
    if(!lc.length){var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0];if(top)lc=[top]}
    if(!lc.length)throw new Error('這份 PDF 裡找不到地籍線條');
    var segs=geoSegs(ex,function(it){return lc.indexOf(it.color)>=0});
    GEOIM.busy='正在切出細部計畫圖裡的地塊…';renderGeoPanel();await geoTick();

    GEOIM.busy='';
  }catch(e){GEOIM.busy='';GEOIM.err='讀取細部計畫圖失敗:'+(e&&e.message?e.message:e)}

async function geoRegisterNow(){
  if(!GEOIM.cad||!GEOIM.zon||!GEOIM.as||!GEOIM.as.K||!GEOIM.cp)return;
  GEOIM.busy='正在把細部計畫圖對位到地籍圖上(約需幾秒)…';GEOIM.err='';renderGeoPanel();await geoTick();
  var K=GEOIM.as.K,cadSegs=GEOIM.cad.segs.map(function(sg){return sg.map(function(v){return v*K})});
  var tr=mkRegister(GEOIM.cp,GEOIM.zon.polys,cadSegs,GEOIM.zon.segs);
  GEOIM.reg=tr;GEOIM.groups=[];
  if(tr){
    var by={};
    GEOIM.zon.fills.forEach(function(f){var b=by[f.color]||(by[f.color]={color:f.color,n:0,area:0});b.n++;b.area+=mkArea(f.rings[0].pts)*tr.s*tr.s});
    GEOIM.groups=Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.area-a.area});
    GEOIM.groups.forEach(function(g){if(GEOIM.names[g.color]===undefined){GEOIM.names[g.color]=KNOWN_ZC[g.color]||'';GEOIM.skip[g.color]=(g.color==='#ffff00')}});
    GEOIM.geo=buildImGeo();
  }else GEOIM.err='沒辦法把細部計畫圖對到地籍圖上。請確認兩份圖是同一個地區,而且細部計畫圖有畫出地籍線。';
  GEOIM.busy='';renderGeoPanel();
}
function buildImGeo(){
  if(!GEOIM.cad||!GEOIM.as||!GEOIM.as.n||!GEOIM.cp)return null;
  var K=GEOIM.as.K,texts=GEOIM.cad.ex.texts.map(function(t){return {s:t.s,x:t.x*K,y:t.y*K}}),zoneItems=[],areaBy={},colBy={};
  if(GEOIM.reg&&GEOIM.zon){
    var tr=GEOIM.reg;
    GEOIM.zon.fills.forEach(function(f){
      var nm=(GEOIM.names[f.color]||'').trim();if(!nm||GEOIM.skip[f.color])return;
      zoneItems.push({name:nm,rings:f.rings.map(function(r){return r.pts.map(function(q){return mkApply(tr,q)})})});
      var a=mkArea(f.rings[0].pts)*tr.s*tr.s;areaBy[nm]=(areaBy[nm]||0)+a;

/* ---------- deed (謄本 PDF) reader ---------- */
var PDFJS_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function normDeedText_(v){return String(v||'').normalize('NFKC').replace(/\u2EA0/g,'民').replace(/臺/g,'台')}
function deedNum_(v){return parseFloat(String(v).replace(/,/g,''))}
function deedBlank_(v){v=String(v||'').trim();return (v==='(空白)'||v==='空白')?'':v}
function deedNumberText_(main,sub){var m=parseInt(main,10),u=parseInt(sub,10);return u?(m+'-'+u):String(m)}
function deedSplitLoc_(countyHint,text,explicitSeg){
  var t=String(text||'').replace(/\s+/g,''),county='',town='',seg='',m;
  if(explicitSeg){
    m=t.match(/^(.{2,3}[縣市])(.+[鄉鎮市區])$/);
    if(m){county=m[1];town=m[2]}else town=t;
    seg=String(explicitSeg).replace(/\s+/g,'');
  }else{
    county=countyHint||'';
    m=t.match(/^(.{1,4}?[鄉鎮區])(.+)$/)||t.match(/^(.{1,3}市)(.+)$/);
    if(m){town=m[1];seg=m[2]}else seg=t;
  }
  return {county:county,town:town,district:seg};
}
var DEED_TITLES_=['土地標示部','建物標示部','土地所有權部','建物所有權部','土地他項權利部','建物他項權利部','土地增值稅概算表'];
function deedIsNoise_(line){
  var t=line.trim();
  if(!t)return true;
  if(/^第\d+頁$/.test(t))return true;
  if(/^[0-9A-Z]{2,3}$/.test(t))return true;
  if(/^.{2,12}地政事務所$/.test(t))return true;
  if(/^(本查詢資料|查詢時間|列印時間)/.test(t))return true;
  return false;
}
var DEED_LABELS_=['登記次序','登記日期','登記原因','原因發生日期','所有權人','統一編號','住址','權利範圍','權狀字號','相關他項權利登記次序','其他登記事項'];
function deedParseOwnership_(lines){
  var entries=[],cur=null,waiting='',cont=false;
  function start(){cur={date:'',reason:'',name:'',id:'',share:'',addr:''};entries.push(cur);waiting='';cont=false}
  function put(label,val){
    val=String(val||'').replace(/\s+/g,'');
    if(label==='登記日期')cur.date=val;
    else if(label==='登記原因')cur.reason=val;
    else if(label==='所有權人'){if(cur.name)start();cur.name=val}
    else if(label==='統一編號')cur.id=val;
    else if(label==='權利範圍')cur.share=val;
    else if(label==='住址')cur.addr=val;
  }
  var TRACK={'登記日期':1,'登記原因':1,'所有權人':1,'統一編號':1,'權利範圍':1,'住址':1};
  lines.forEach(function(raw){
    var l=String(raw).trim();if(!l||deedIsNoise_(l))return;
    var parts=l.split(/(?=(?:登記次序|登記日期|登記原因|原因發生日期|所有權人|統一編號|住址|權利範圍|權狀字號|相關他項權利登記次序|其他登記事項)\s*:)/);
    parts.forEach(function(part){
      part=part.trim();if(!part||/^\(\d{4}\)$/.test(part))return;
      var m=part.match(/^(登記次序|登記日期|登記原因|原因發生日期|所有權人|統一編號|住址|權利範圍|權狀字號|相關他項權利登記次序|其他登記事項)\s*:?\s*(.*)$/);
      if(m){
        var label=m[1],val=m[2];
        cont=(label==='住址');
        if(label==='登記次序'){start();return}
        if(!cur&&(label==='所有權人'||label==='登記日期'))start();
        if(!cur)return;
        if(TRACK[label]){if(val)put(label,val),waiting='';else waiting=label}
        else waiting='';
      }else if(waiting&&cur){var wl=waiting;put(waiting,part);waiting='';cont=(wl==='住址')}
      else if(cont&&cur&&part)cur.addr+=part.replace(/\s+/g,'');
    });
  });
  return entries.filter(function(e){return e.name});
}
function deedParseLiens_(lines){
  var types=[];
  lines.forEach(function(raw){
    var m=String(raw).match(/權利種類\s*:?\s*(\S+)/);
    if(m&&types.indexOf(m[1])<0)types.push(m[1]);
  });
  return types;
}
function parseDeedPages_(rawPages){
  var lines=[];
  rawPages.forEach(function(pg){pg.forEach(function(l){lines.push(normDeedText_(l))})});
  var countyHint='';
  lines.some(function(l){var m=l.match(/資料管轄機關\s*:\s*(\S{2,3}[縣市])/);if(m){countyHint=m[1];return true}return false});
  var titleLoc=null;
  lines.slice(0,8).some(function(l){
    var m=l.trim().match(/^(.+?)\s*(\d{3,5})-(\d{3,4})\s*(地號|建號)$/);
    if(m){titleLoc={text:m[1],main:m[2],sub:m[3]};return true}return false;
  });
  var headerIdx=[];
  lines.forEach(function(l,i){var key=l.replace(/[*\s]/g,'');if(DEED_TITLES_.indexOf(key)!==-1)headerIdx.push({i:i,key:key})});
  function bodyOf(k){var end=k+1<headerIdx.length?headerIdx[k+1].i:lines.length;return lines.slice(headerIdx[k].i+1,end)}
  var records=[];
  headerIdx.forEach(function(h,k){
    if(h.key!=='土地標示部'&&h.key!=='建物標示部')return;
    var body=bodyOf(k),isLand=h.key==='土地標示部';
    var own=[],lien=[],q;
    for(q=k+1;q<headerIdx.length;q++){
      var kk=headerIdx[q].key;
      if(kk==='土地標示部'||kk==='建物標示部')break;
      if(kk==='土地所有權部')own=own.concat(bodyOf(q));
      if(kk==='土地他項權利部')lien=lien.concat(bodyOf(q));
    }
    var rec={kind:isLand?'land':'building',source:'',warnings:[]};
    var loc=null,j,m;
    for(j=0;j<Math.min(body.length,4);j++){
      m=body[j].match(/^(.+?)\s*>\s*(.+?)\s*(?:\(\d+\))?\s*>\s*(地號|建號)\s*(\d{3,5})-(\d{3,4})/);
      if(m){loc={countyTown:m[1],seg:m[2],main:m[4],sub:m[5]};break}
    }
    if(loc){
      rec.source='電傳';
      var r1=deedSplitLoc_('',loc.countyTown,loc.seg);
      rec.county=r1.county;rec.town=r1.town;rec.district=r1.district;rec.number=deedNumberText_(loc.main,loc.sub);
    }else if(titleLoc){
      rec.source='電子謄本';
      var r2=deedSplitLoc_(countyHint,titleLoc.text,'');
      rec.county=r2.county;rec.town=r2.town;rec.district=r2.district;rec.number=deedNumberText_(titleLoc.main,titleLoc.sub);
    }else{rec.source='未知';rec.county='';rec.town='';rec.district='';rec.number=''}
    var content=body.filter(function(l){return !deedIsNoise_(l)});
    function firstMatch(re){for(var z=0;z<content.length;z++){var mm=content[z].trim().match(re);if(mm)return mm}return null}
    if(isLand){
      var area=firstMatch(/^面\s*積\s*:?\s*\**\s*([\d,]+(?:\.\d+)?)\s*平方公尺/);
      rec.areaM2=area?deedNum_(area[1]):null;
      var zl=firstMatch(/^使用分區\s*:?\s*(\S+)/),cl=null;
      content.some(function(l){var mm=l.match(/使用地類別\s*:?\s*(\S+)/);if(mm){cl=mm;return true}return false});
      rec.zoning=zl?deedBlank_(zl[1]):'';
      rec.landCategory=cl?deedBlank_(cl[1]):'';
      var vm=content.join('\n').match(/公告土地現值\s*:?\s*\**\s*([\d,]+(?:\.\d+)?)\s*元/);
      rec.value=vm?deedNum_(vm[1]):0;
      rec.ownership=deedParseOwnership_(own);
      rec.liens=deedParseLiens_(lien);
      if(rec.areaM2===null)rec.warnings.push('找不到土地面積');
      if(!rec.ownership.length)rec.warnings.push('沒有讀到所有權部的地主資料(可能不是完整謄本)');
    }else{
      var addr=firstMatch(/^建物門牌\s*:?\s*(\S.*)$/);
      rec.address=addr?addr[1].trim():'';
      rec.lots=[];
      for(var z=0;z<content.length;z++){
        var lm=content[z].trim().match(/^建物坐落地號\s*:?\s*(.*)$/);
        if(!lm)continue;
        var chunk=lm[1],nextIdx=z+1;
        while(nextIdx<content.length&&/^(?:[\u4e00-\u9fa5]*段\s*)?(?:\d{3,5}-\d{3,4}\s*)+$/.test(content[nextIdx].trim())){chunk+=' '+content[nextIdx].trim();nextIdx++}
        var curSeg='';
        chunk.split(/\s+/).forEach(function(tok){
          if(!tok)return;
          var nm=tok.match(/^(\d{3,5})-(\d{3,4})$/);
          if(nm)rec.lots.push({segment:curSeg,number:deedNumberText_(nm[1],nm[2])});else curSeg=tok;
        });
        break;
      }
      var use=firstMatch(/^主要用途\s*:?\s*(\S.*)$/);rec.mainUse=use?use[1].trim():'';
      var fl=firstMatch(/層\s*數\s*:?\s*(\d+)\s*層/);rec.floors=fl?parseInt(fl[1],10):null;
      var total=null;
      for(var t=0;t<content.length;t++){var tm=content[t].match(/總\s*面\s*積\s*:?\s*\**\s*([\d,]+(?:\.\d+)?)\s*平方公尺/);if(tm){total=tm;break}}
      rec.totalAreaM2=total?deedNum_(total[1]):null;
      var dm=firstMatch(/^建築完成日期\s*:?\s*民國\s*(\d+)\s*年\s*(\d+)\s*月\s*(\d+)\s*日/);
      rec.completion=dm?{rocYear:parseInt(dm[1],10),month:parseInt(dm[2],10),day:parseInt(dm[3],10)}:null;
      if(rec.totalAreaM2===null)rec.warnings.push('找不到建物總面積');
    }
    records.push(rec);
  });
  return records;
}
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(resolve,reject){
    var sc=document.createElement('script');
    sc.src=PDFJS_CDN+'pdf.min.js';
    sc.onload=function(){
      if(!window.pdfjsLib){reject(new Error('PDF 讀取元件載入後無法使用'));return}
      try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CDN+'pdf.worker.min.js'}catch(e){}
      resolve(window.pdfjsLib);
    };
    sc.onerror=function(){reject(new Error('無法載入 PDF 讀取元件'))};
    document.head.appendChild(sc);
  });
}
function fileToBuffer(file){
  return new Promise(function(resolve,reject){
    var rd=new FileReader();
    rd.onload=function(){resolve(rd.result)};
    rd.onerror=function(){reject(new Error('讀取檔案失敗'))};
    rd.readAsArrayBuffer(file);
  });
}
async function readPdfPages(file){
  var lib=await loadPdfJs(),buf=await fileToBuffer(file);
  var doc=await lib.getDocument({data:new Uint8Array(buf)}).promise,pages=[];
  for(var p=1;p<=doc.numPages;p++){
    var page=await doc.getPage(p),tc=await page.getTextContent();
    var items=tc.items.filter(function(i){return i.str&&i.str.trim()!==''}).map(function(i){return {s:i.str,x:i.transform[4],y:i.transform[5],w:i.width}});
    items.sort(function(a,b){return Math.abs(b.y-a.y)>3?b.y-a.y:a.x-b.x});
    var lines=[];
    items.forEach(function(it){var last=lines[lines.length-1];if(last&&Math.abs(last.y-it.y)<=3)last.items.push(it);else lines.push({y:it.y,items:[it]})});
    pages.push(lines.map(function(l){
      l.items.sort(function(a,b){return a.x-b.x});
      var t='',prevEnd=null;
      l.items.forEach(function(it){if(prevEnd!==null&&it.x-prevEnd>6)t+='  ';t+=it.s;prevEnd=it.x+it.w});
      return t;
    }));
  }
  return pages;
}
function deedRecText(r){
  var loc=(r.county||'')+(r.town||'')+' '+(r.district||'');
  if(r.kind==='land')return '土地｜'+loc+' '+r.number+' 地號｜'+(r.areaM2==null?'面積?':comma(r.areaM2)+' ㎡')+'｜地主 '+((r.ownership||[]).length)+' 位'+((r.liens||[]).length?'｜有他項權利':'');

}
function deedToImport(){

function addDeedPages(pages,fileName){

      var po=p.owners.filter(function(x){return x.owner===it.ownerId})[0];
      if(po){po.share=it.share.txt;po.frac=it.share.f;mark(p,it.text,true)}
    }else if(it.kind==='owner-add'){
      var base=it.e.name,masked=/\*/.test(base);
      var o=DB.owners.filter(function(x){return ownerKeysOf(x).indexOf(it.key)>=0})[0];
      if(!o){o={id:nextOwnerId(),name:it.key,type:masked?'自然人':inferType(base),asg:{},phone:'(未填)',regAddr:it.e.addr||'',resAddr:'',resSame:false,pending:masked,tjName:masked?it.key:'',maskedId:masked?(it.e.id||''):'',idno:it.e.id||''};DB.owners.push(o);OWN[o.id]=o}
      if(!o.asg[it.pid]){
        var cnt={};p.owners.forEach(function(x){var a=asgOf(OWN[x.owner],it.pid);cnt[a]=(cnt[a]||0)+1});
        o.asg[it.pid]=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0]||PRJ[it.pid].staff[0];
      }
      var sh=it.share||approxShare(1/(p.owners.length+1));
      p.owners.push({owner:o.id,share:sh.txt,frac:sh.f,reason:it.e.reason||'',rdate:normRocDate(it.e.date)||''});
      mark(p,it.text,true);
    }else if(it.kind==='owner-gone'){
      if(it.gone==='other'&&!(it.otherText||'').trim()){missingText++;return}
      var idx=-1;p.owners.forEach(function(x,i){if(x.owner===it.ownerId)idx=i});
      if(idx<0)return;
      var gone=p.owners.splice(idx,1)[0];
      if(!p.owners.length){p.owners.push(gone);blocked++;return}
      p.goneOwners.push({owner:gone.owner,share:gone.share,frac:gone.frac,kind:it.gone,other:(it.otherText||'').trim(),date:it.gdate,reason:it.reason});
      mark(p,(OWN[gone.owner]?OWN[gone.owner].name:'地主')+' '+goneLabel(it.gone,(it.otherText||'').trim())+(it.reason?'('+it.reason+')':''),true);
    }else if(it.kind==='parcel-add'){
      var np=applySplitParcel(it,today);
      if(np){addedParcels++;mark(DB.parcels[it.parcel],'分割出新地號 '+it.rec.number,true)}
    }else if(it.kind==='deed-date'){
      it.ids.forEach(function(id){var q=DB.parcels[id];q.deedDate=today;mark(q,'',false)});
    }
    it.applied=true;n++;
  });
  Object.keys(touched).forEach(function(k){
    var x=touched[k];
    x.p.deedHistory.unshift({date:today,file:UP.matchedIds[x.p.id]||'謄本更新',summary:x.t.length?x.t.join(';'):'沒有變化,只更新取得日期'});
  });
  DB.log.unshift({ts:new Date(),user:ROLE_LABEL[S.role],action:'套用謄本更新',detail:PRJ[UP.pid].name+':'+({auto:'自動更新',confirm:'需確認的更新',alert:'警示'})[cat]+' '+n+' 項'});
  indexDB();if(addedParcels)buildMap();renderAll();
  toast('已套用 '+n+' 項更新。'+(blocked?'有 '+blocked+' 項因為會讓地號沒有任何所有權人,沒有套用。':'')+(missingText?'有 '+missingText+' 項選了「其他」但還沒填實際狀況,沒有套用。':''));
}

async function api(action,payload){
  var body=Object.assign({action:action,token:TOKEN},payload||{}),j;
  try{
    var res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    j=await res.json();
  }catch(e){var ne=new Error('連不上伺服器,請檢查網路');ne.userMessage=ne.message;throw ne}
  if(!j.ok){var e2=new Error(j.error||'失敗');e2.userMessage=j.error||'失敗';e2.auth=/請先登入|過期|停用/.test(j.error||'');throw e2}
  return j.data;
}
var Q=Promise.resolve();
function apiSync(a,p){

function gridLayout(list){
  var n=list.length;if(!n)return;
  var cols=Math.max(1,Math.ceil(Math.sqrt(n*920/580))),cw=920/cols,rows=Math.ceil(n/cols),ch=Math.min(580/rows,cw);
  list.forEach(function(p,i){
    var x=40+(i%cols)*cw+2,y=40+Math.floor(i/cols)*ch+2,w=cw-4,h=ch-4;
    p.pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];p.cx=x+w/2;p.cy=y+h/2;p.lf=Math.max(5,Math.min(13,Math.min(w,h)*0.33));
  });
}
async function adapt(data){
  var db=emptyDB();
  db.staff=(data.staffNames||[]).map(function(n){return {id:n,active:true}});
  SRV={own:{},par:{}};
  var PM={};
  data.projects.forEach(function(p){
    var np={id:p['專案ID'],name:p['專案名稱'],type:p['開發類型']||'',status:p['狀態']||'規劃中',sec:'',region:'',staff:L_(p['承辦業務成員(姓名,逗號分開)']),w:[1,0,0,0,0,0],blocks:[{name:'全區',use:'',x0:40,w:920,y0:40,h:580,cols:1,rows:1}],schematic:true,rule:{headPct:num_(p['同意門檻-人數%'])||50,sharePct:num_(p['同意門檻-持分%'])||50},_geoId:p['圖資檔案ID(Drive)']||''};
    db.projects.push(np);PM[np.id]=np;
  });
  data.owners.forEach(function(o,i){
    var n=i+1;SRV.own[o['地主ID']]=n;
    db.owners.push({id:n,name:o['姓名'],type:o['身分類型']||'自然人',asg:{},asg2:{},phone:'',regAddr:'',resAddr:'',resSame:false,note:'',contact:'',src:'',pending:o['姓名狀態']==='待確認',tjName:o['謄本顯示姓名']||'',maskedId:'',idno:'',inherit:{status:o['繼承狀態']||'',missing:o['缺少文件']||''},family:o['家族群組']||'',win:{},rep:{name:'',canSign:''},_srv:o['地主ID']});
  });
  data.projectOwners.forEach(function(po){
    var n=SRV.own[po['地主ID']];if(!n)return;var o=db.owners[n-1];
    o.asg[po['專案ID']]=po['主要承辦(姓名)']||'';o.asg2[po['專案ID']]=po['次要承辦(姓名)']||'';
    if(po['窗口']==='是')o.win[po['專案ID']]=true;
    db.deals[po['專案ID']+'|'+n]={ask:num_(po['開價(元/坪)']),offer:num_(po['出價(元/坪)']),stage:po['簽約階段']||'未開始',stageLog:[],note:po['條件備註']||''};
  });
  var shBy={},bdBy={};
  data.shares.forEach(function(r){(shBy[r['地號ID']]=shBy[r['地號ID']]||[]).push(r)});
  data.buildings.forEach(function(r){(bdBy[r['地號ID']]=bdBy[r['地號ID']]||[]).push({no:r['建號'],addr:r['門牌']||'',area:num_(r['面積㎡']),use:r['主要用途']||'',done:r['完成日']||''})});
  var skipped=0;
  data.parcels.forEach(function(r){
    var np={id:db.parcels.length,proj:r['專案ID'],no:r['地號'],sec:r['段別']||'',region:(r['縣市']||'')+(r['鄉鎮市區']||''),block:0,pts:null,cx:0,cy:0,area:num_(r['面積㎡']),use:r['使用分區']||'',cat:r['使用地類別']||'',value:num_(r['公告現值(元/㎡)']),status:'',lien:!!r['他項權利'],lienTxt:r['他項權利']||'',buildings:bdBy[r['地號ID']]||[],deedDate:r['謄本取得日期']||'',deedHistory:[],goneOwners:[],changed:false,changeNotes:[],owners:[],factory:{on:r['特定工廠']==='是',name:r['工廠名稱']||''},constraints:[],checklist:{},surveys:[],prevValue:num_(r['前次移轉現值(元/㎡)']),idx:num_(r['物價指數倍率'])||1,_srv:r['地號ID']};
    (shBy[r['地號ID']]||[]).forEach(function(sr){
      var n=SRV.own[sr['地主ID']];if(!n)return;
      var sh=normShare(sr['持分分數']),st=sr['狀態']||'現有',it={owner:n,share:sh?sh.txt:(sr['持分分數']||''),frac:sh?sh.f:(num_(sr['持分比例'])||0),reason:sr['登記原因']||'',rdate:sr['登記日期']||''};
      if(st==='現有')np.owners.push(it);
      else np.goneOwners.push({owner:n,share:it.share,frac:it.frac,kind:st==='已成交'?'deal':st==='已轉手'?'transfer':'other',other:sr['狀態說明']||'',date:sr['狀態日期']||'',reason:sr['狀態說明']||''});
    });
    if(!np.owners.length){skipped++;return}
    SRV.par[r['地號ID']]=np.id;db.parcels.push(np);
  });
  db.skipped=skipped;
  // geometry
  for(var pi=0;pi<db.projects.length;pi++){
    var pr=db.projects[pi],plist=db.parcels.filter(function(p){return p.proj===pr.id}),geo=null;
    if(pr._geoId){
      if(GEOC[pr.id]===undefined){try{GEOC[pr.id]=await api('getGeo',{projectId:pr.id})}catch(e){if(e.auth)throw e;GEOC[pr.id]=null}}
      geo=GEOC[pr.id];
    }
    if(geo&&geo.parcels){
      pr.geo={ctx:geo.ctx||[],ctxlab:geo.ctxlab||[],zones:geo.zones||{},dev:geo.dev||[],scale:geo.scale||1,zc:geo.zc};pr.schematic=false;
      var miss=[];
      plist.forEach(function(p){
        var gq=geo.parcels[p.no];
        if(gq){p.pts=gq.pts;p.cx=gq.c[0];p.cy=gq.c[1];p.lf=gq.lf;p.mix=gq.mix;p.polyArea=gq.poly_m2;p.planZone=domZone(gq)}
        else miss.push(p);
      });
      miss.forEach(function(p,mi){var mx=40+(mi%40)*20,my=600+Math.floor(mi/40)*20;p.pts=[[mx,my],[mx+16,my],[mx+16,my+16],[mx,my+16]];p.cx=mx+8;p.cy=my+8;p.lf=5});
    }else gridLayout(plist);
  }
  var ivid=0;
  data.interviews.forEach(function(r){
    var n=SRV.own[r['地主ID']];if(!n)return;
    db.interviews.push({id:++ivid,sid:r['訪談ID'],owner:n,proj:r['專案ID'],date:parseISO(r['日期']),method:r['方式']||'',by:r['記錄人']||'',summary:r['內容摘要']||'',level:r['意願']||'N',next:r['下次跟進日']?parseISO(r['下次跟進日']):null,tags:L_(r['關切標籤(逗號分開)'])});
  });
  (data.otherStates||[]).forEach(function(r){
    var n=SRV.own[r['地主ID']];if(!n)return;
    db.interviews.push({id:++ivid,synthetic:true,owner:n,proj:r['專案ID'],date:parseISO(r['日期']),method:'',by:'',summary:'(不是你負責的地主,內容不顯示)',level:r['意願']||'N',next:r['下次跟進日']?parseISO(r['下次跟進日']):null,tags:[]});
  });
  db.seq=ivid;
  data.tasks.forEach(function(r){
    var n=r['地主ID']?SRV.own[r['地主ID']]:null;
    db.tasks.push({id:++db.tid,sid:r['任務ID'],pid:r['專案ID'],owner:n||null,title:r['內容'],assignee:r['負責人'],due:r['期限'],done:r['完成']==='是',by:r['建立者']||'',created:r['建立日期']||''});
  });
  DB=db;
}
/* ---- owner dialog loads personal data on demand (and the server logs the view) ---- */
var curOwner=null;
function openOwner(id){
  var o=OWN[id];curOwner=id;
  openOwner0(id);
  if(!o||o._priv||!canSeeOwner(o))return;
  api('getOwnerPrivate',{projectId:S.proj,ownerId:o._srv}).then(function(p){
    o.phone=p['電話']||'(未填)';o.idno=p['身分證字號/統編']||'';o.regAddr=p['戶籍地']||'';o.resAddr=p['居住地']||'';o.resSame=p['居住地同戶籍']==='是';o.note=p['備註']||'';o.contact=p['聯絡方式(原文)']||'';o._priv=true;
    if($('#dlg-owner').open&&curOwner===id)openOwner0(id);
  }).catch(function(e){if(e.auth)showLogin('登入已過期,請重新登入');else toast('讀不到個資:'+(e.userMessage||e.message))});
}
function phoneText(o,pid){return o._priv?esc(o.phone||'(未填)'):(canSeeOwner(o,pid)?'(開啟地主詳情後顯示)':'09○○-○○○-○○○')}
function addrInline(o,pid){return (o._priv&&canSeeOwner(o,pid))?'<div class="small muted">戶籍地 '+esc(regOf(o)||'未填')+' · 居住地 '+esc(resText(o)||'未填')+'</div>':''}
function addrLines(o,pid){
  if(!canSeeOwner(o,pid))return '<div class="small muted" style="margin-top:4px">戶籍地、居住地:只有負責的業務看得到</div>';
  if(!o._priv)return '<div class="small muted" style="margin-top:4px">戶籍地與居住地:打開地主詳情後顯示</div>';
  return '<div class="small muted" style="margin-top:4px">戶籍地 '+esc(regOf(o)||'未填')+'</div><div class="small muted" style="margin-top:4px">居住地 '+esc(resText(o)||'未填')+'</div>';
}
/* ---- parcel panel: agreement only (other sections are not saved to the server yet) ---- */
function parcelExtraHTML(p){
  var ag=agreeOf(p),rule=PRJ[p.proj].rule||{headPct:50,sharePct:50},ok=agreeOk(p);
  var un=p.owners.filter(function(po){return !agrees(OWN[po.owner],p.proj)}).map(function(po){var o=OWN[po.owner];return esc(o.name)+'('+lvl(LV[oState(o,p.proj).lv])+')'});
  var h='<h3>同意進度</h3><div class="ocard"><div class="small">同意 '+ag.agree+' / '+ag.heads+' 位(約 '+Math.round(ag.hp*100)+'%),持分合計 '+Math.round(ag.sp*100)+'% · '+(ok?'<span class="ok">已超過門檻</span>':'<span class="over">還沒達門檻</span>')+'</div>'
    +(un.length?'<div class="small" style="margin-top:4px">還沒同意:'+un.join('、')+'</div>':'')
    +'<div class="small muted" style="margin-top:4px">「同意」指意願 A,或已簽意願書以上。門檻目前設為人數 '+rule.headPct+'%、持分 '+rule.sharePct+'% 以上,實際請依法務確認。</div></div>';
  if(isFactory(p))h+='<div class="small" style="margin-top:8px"><b>*</b> 特定工廠'+((p.factory&&p.factory.name)?':'+esc(p.factory.name):'')+'</div>';
  return h;
}

  h+='<div class="field"><label for="fm-fam">家族或親屬群組</label><input type="text" id="fm-fam" value="'+esc(o.family||'')+'" placeholder="例:陳家"></div>';
  return h+'<div class="actions"><button class="btn primary" type="button" data-fam-save="'+o.id+'">儲存</button></div>';
}
/* ---- admin: users ---- */
async function loadUsers(){try{USERS=await api('listUsers');renderAdmin()}catch(e){if(e.auth)showLogin('登入已過期,請重新登入')}}
function renderAdmin(){
  var el=$('#admin-page');if(!el)return;
  if(S.role!=='admin'){el.innerHTML='';return}
  var h='<h1>後台:使用者</h1><p class="muted" style="margin:0">管理誰可以登入。信箱要和寄驗證碼的信箱一樣。專案負責人要填負責的專案ID,業務由專案成員決定能看到哪些專案。</p>';
  h+='<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>信箱</th><th>姓名</th><th>角色</th><th>啟用</th><th>負責專案</th><th></th></tr></thead><tbody>';
  USERS.forEach(function(u,i){h+='<tr><td>'+esc(u['信箱'])+'</td><td>'+esc(u['姓名'])+'</td><td>'+esc(u['角色'])+'</td><td>'+esc(u['啟用'])+'</td><td>'+esc(u['負責專案(專案ID,用逗號分開)']||'')+'</td><td><button class="btn small" type="button" data-user-edit="'+i+'">編輯</button></td></tr>'});
  h+='</tbody></table></div>';
  h+='<div class="panel" style="margin-top:14px"><h2>新增或修改使用者</h2><div class="row2"><div class="field" style="margin-top:0"><label for="us-email">信箱</label><input type="email" id="us-email"></div><div class="field" style="margin-top:0"><label for="us-name">姓名</label><input type="text" id="us-name"></div></div>'
    +'<div class="row2"><div class="field"><label for="us-role">角色</label><select id="us-role"><option>業務人員</option><option>專案負責人</option><option>管理員</option></select></div><div class="field"><label for="us-proj">負責專案ID(專案負責人才需要,逗號分開)</label><input type="text" id="us-proj" placeholder="P001,P002"></div></div>'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:14px"><input type="checkbox" id="us-active" checked style="width:auto"> 啟用</label><div class="actions"><button class="btn primary" type="button" data-user-save>儲存</button></div></div>';
  el.innerHTML=h;
}
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;var b;
  if((b=t.closest('[data-user-edit]'))){
    var u=USERS[+b.dataset.userEdit];if(!u)return;
    $('#us-email').value=u['信箱'];$('#us-name').value=u['姓名'];$('#us-role').value=u['角色'];$('#us-proj').value=u['負責專案(專案ID,用逗號分開)']||'';$('#us-active').checked=u['啟用']!=='否';return;
  }
  if(t.closest('[data-user-save]')){
    api('saveUser',{email:$('#us-email').value,name:$('#us-name').value,role:$('#us-role').value,projects:L_($('#us-proj').value),active:$('#us-active').checked}).then(function(){toast('已儲存使用者。');loadUsers()}).catch(function(e){toast(e.userMessage||e.message)});
  }
});

/* ---------- start ---------- */
function pickStart(){
  indexDB();
  var best=null,list=PP();
  list.forEach(function(p){if(best===null&&p.owners.length>1&&pState(p).lv!=='N')best=p.id});
  if(best===null&&list.length)best=list[0].id;
  S.sel=best;paintMap();renderDetail();
}
DB=emptyDB();indexDB();
initMapEvents();initDownloads();initLogin();
})();
